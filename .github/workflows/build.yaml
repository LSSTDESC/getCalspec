name: build_and_test

on:
  push:
    branches:
      - main
      - lsst-dev
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniforge-variant: Miniforge3
          use-mamba: true
          show-channel-urls: true
          activate-environment: test

      - name: Install
        shell: bash -l {0}
        run: |
          pip install pytest
          pip install -v -e .

      - name: List installed packages
        shell: bash -l {0}
        run: |
          pip list -v

      - name: Check CSV columns
        shell: bash -l {0}
        run: |
          head -1 calspec_data/calspec.csv
          echo "Number of lines in CSV:"
          wc -l calspec_data/calspec.csv
          echo "Checking for duplicate lines:"
          tail -5 calspec_data/calspec.csv
          echo "---"
          python -c "import pandas as pd; df = pd.read_csv('calspec_data/calspec.csv', index_col=0); print(f'DataFrame length: {len(df)}'); print(f'Unique Star_name: {df.Star_name.nunique()}'); print(f'Duplicates: {df.duplicated().sum()}'); print(df.tail(10)[['Star_name']])"

      - name: Run pytest
        shell: bash -l {0}
        run: |
          pytest tests
